{lv:"Level 1 — Foundations",t:"What Is Artificial Intelligence?",p:[
["What is AI?",`<p>Artificial Intelligence (AI) is software that performs tasks which normally need human judgment: recognizing a face, translating a sentence, recommending a film, or writing an email.</p>
<div class="box"><b>Everyday analogy</b><p>Traditional software is a recipe: every step is written by a person. Modern AI is more like a cook who has tasted ten million dishes and learned what tends to work, without anyone writing the recipe.</p></div>
<h2>Rules versus learning</h2><p>Early AI used hand-written rules ("if the email contains this word, mark it as spam"). Modern AI mostly uses <b>machine learning</b>: the program studies many examples and adjusts itself until it makes good predictions on its own.</p>
<div class="tw"><table><tr><th></th><th>Rule-based software</th><th>Machine learning</th></tr><tr><td>Who writes the logic?</td><td>A programmer</td><td>The training process</td></tr><tr><td>Handles messy input?</td><td>Poorly</td><td>Much better</td></tr><tr><td>Example</td><td>A calculator</td><td>A spam filter</td></tr></table></div>
<figure class='dg' data-dg='ai'></figure><h2>Real-world uses</h2><p>Maps estimating arrival times, banks flagging odd transactions, phone cameras sharpening photos, and assistants like ChatGPT all rely on machine learning.</p><div class='box fact'><b>💡 Fun fact</b><p>The term “artificial intelligence” was introduced around a summer research workshop at Dartmouth College in 1956. The field is older than most people think.</p></div><div class='box chal'><b>🎯 Practical challenge</b><p>Spot AI in your day. List three apps on your phone that learn from examples (spam filtering and photo search are good starts). Then name one task on your phone that only follows fixed rules.</p></div>`],
["Generative AI and ChatGPT",`<p>Most AI predicts or classifies: “Is this email spam?” <b>Generative AI</b> creates something new: text, images, audio, code or video, based on patterns it learned during training.</p>
<p><b>ChatGPT</b> is a chat application built on a <b>Large Language Model (LLM)</b>. The LLM is the engine; the chat window is the dashboard. Claude, Gemini and others work the same way in principle.</p>
<h2>What an LLM is</h2><p>An LLM is a neural network trained on a very large amount of text. It learns the statistical patterns of language: which words, ideas and structures tend to follow others. That lets it answer questions, summarize, translate and write code.</p>
<div class="box"><b>Key idea</b><p>An LLM does not look answers up in a database. It generates a response word-piece by word-piece, based on patterns. This is why it can be brilliant and also confidently wrong.</p></div>
<h2>Mini experiment</h2><p>Open any chatbot and type: <i>“Explain rain to a five-year-old.”</i> Then: <i>“Explain rain to a meteorologist.”</i> Same topic, very different answers. The only thing you changed was the prompt. That is the whole subject of this book.</p><div class='box fact'><b>💡 Fun fact</b><p>ChatGPT was released to the public in November 2022. The “GPT” in its name stands for Generative Pre-trained Transformer.</p></div>`],
["Misconceptions and practice",`<h2>Four common misconceptions</h2>
<p><b>“AI understands like a human.”</b> It models patterns in language very well, but it has no life experience behind the words.</p>
<p><b>“AI always tells the truth.”</b> It can produce fluent text that is false (called a hallucination, covered in Chapter 2).</p>
<p><b>“AI searches the internet for every answer.”</b> Not by default. Many models answer from training alone unless a search tool is attached.</p>
<p><b>“A better AI makes prompts irrelevant.”</b> Better models forgive vagueness more, but clear instructions still give better results.</p>
<div class='box fun'><b>😄 Real-life comedy</b><p>Ask an AI to “make me a sandwich” and you may get a thoughtful essay about sandwiches, and still no sandwich. It is a language machine, not a kitchen. Knowing what it can and cannot do is half the skill.</p></div><h2>Practice</h2><p>1. List three AI tools you used this week without calling them AI.<br>2. Decide: is a calculator AI? Why or why not?</p>
<details><summary>Reveal answer notes</summary><p>2. A calculator follows fixed rules written by a person and does not learn from examples, so it is normally not called AI. A spam filter that learns from labeled emails is machine learning.</p></details>`]],
q:[["AI that creates new text or images is called…",["Generative AI","A calculator","A database"],0,"Generative AI produces new content from learned patterns."],["True or false: an LLM always looks up answers in a database.",["True","False"],1,"It generates text from learned patterns, so it can be wrong."],["Which is the ‘engine’ and which is the ‘app’?",["ChatGPT is the engine, the LLM is the app","The LLM is the engine, ChatGPT is the app"],1,"ChatGPT is a chat application built on an LLM."]]},
{lv:"Level 1 — Foundations",t:"How AI Reads and Writes",p:[
["Tokens",`<p>An LLM does not read letters or whole words. It reads <b>tokens</b>: small chunks of text. A token can be a whole common word (“cat”), part of a longer word (“un” + “believ” + “able”), or punctuation.</p>
<p>As a rough rule for English, one token is about ¾ of a word, so 100 words is roughly 130 tokens. Other languages often need more tokens per word.</p>
<div class="box"><b>Analogy</b><p>Think of Lego bricks. Common words are one big brick; rare words are built from several small ones.</p></div>
<p><b>Why you should care:</b> models have limits and sometimes costs measured in tokens, not words.</p><div class='box def'><b>📘 Definition</b><p>A <mark class='d'>token</mark> is a small chunk of text, such as a word, part of a word, or punctuation, that a language model reads and writes.</p></div><p>A long word may be split into pieces (illustrative split):</p><div class='flow'><span>un</span><span>believ</span><span>able</span></div><figure class='dg' data-dg='tok'></figure><div class='box exp'><b>🧪 Try it: token estimator</b><p>Type or paste any English text. The estimate uses a common rule of thumb of about 4 characters per token. Real tokenizers differ.</p><textarea oninput='tke(this)' placeholder='Type something…'></textarea><p class='sm' id='tko'>0 words · 0 characters · about 0 tokens (rough estimate)</p></div>`],
["Context windows",`<p>The <b>context window</b> is the maximum amount of text (your prompt, the conversation so far and the reply, counted in tokens) the model can consider at once.</p>
<div class="box"><b>Analogy</b><p>A desk. Only what fits on the desk can be used. If the conversation grows too long, older material falls off or gets less attention, and the model may seem to “forget” your early instructions.</p></div>
<h2>Practical tips</h2><p>Put the most important instructions clearly, and repeat them in long chats. Start a fresh conversation for a new task. Paste only the parts of a document that matter.</p><div class='box def'><b>📘 Definition</b><p>The <mark class='d'>context window</mark> is the maximum amount of text, counted in tokens, that a model can consider at one time.</p></div><div class='box chal'><b>🎯 Practical challenge</b><p>Start a chat and set three rules: short answers, friendly tone, no jargon. After ten messages, ask the AI to list your rules. Did it remember all three?</p></div>`],
["Next-token prediction and temperature",`<p>At its core, an LLM predicts the next token. Given “The capital of France is”, the token “ Paris” is very likely. It picks one, adds it to the text, and repeats until the answer is complete.</p>
<h2>Temperature</h2><p><b>Temperature</b> controls how adventurous the choice is. Low temperature means it picks the most likely token (predictable, consistent). High temperature allows less likely tokens (varied, creative, riskier).</p>
<div class="tw"><table><tr><th>Task</th><th>Better setting</th></tr><tr><td>Factual summary, code, data extraction</td><td>Low</td></tr><tr><td>Brainstorming names, poems</td><td>Higher</td></tr></table></div>
<p class="sm">Chat apps often hide this setting; APIs usually expose it.</p><div class='box def'><b>📘 Definition</b><p><mark class='d'>Next-token prediction</mark> means the model repeatedly chooses the next small piece of text based on everything before it.</p></div><div class='flow'><span>Your prompt</span><em>→</em><span>Predict next token</span><em>→</em><span>Add it to the text</span><em>↻</em><span>Repeat until done</span></div><figure class='dg' data-dg='llm'></figure><div class='box exp'><b>🧪 Try it: temperature slider</b><p>Sentence: “The sky is…”. Slide to see how the odds of the next word change. These numbers are illustrative, not from a real model.</p><input type='range' min='0' max='10' value='5' oninput='tmp(this.value)' style='width:100%'><p class='sm'>Temperature: <b id='tv'>1.0</b> (left = predictable, right = adventurous)</p><div id='tb'></div></div>`],
["Neural networks, transformers and attention",`<p>A <b>neural network</b> is a large system of numbers (called parameters or weights) arranged in layers. During <b>training</b> on huge amounts of text, those numbers are adjusted so that next-token guesses get better.</p>
<p>Modern LLMs use an architecture called the <b>transformer</b>, introduced in 2017. Its key idea is <b>attention</b>: when processing a token, the model weighs how relevant every other token in the context is.</p>
<div class="box"><b>Example</b><p>In “The trophy didn’t fit in the suitcase because <i>it</i> was too big”, attention helps the model link “it” to “trophy”.</p></div>
<figure class='dg' data-dg='attn'></figure><p>Why this matters for prompting: the model pays attention to everything you write, so clear, relevant context improves results, and irrelevant text can distract it.</p><div class='box fact'><b>💡 Fun fact</b><p>The transformer was introduced in a 2017 research paper titled “Attention Is All You Need”. Most of today’s well-known language models build on that idea.</p></div>`],
["Limits and hallucinations",`<p>A <b>hallucination</b> is a fluent answer that is false or invented, such as a made-up book citation. It happens because the model is built to produce plausible text, not to verify facts.</p>
<h2>Other limits</h2><p>Training data has a cutoff date. Models can be biased by their data. They can make arithmetic and logic mistakes. They only know what is in training or in your prompt.</p>
<h2>Reducing the risk</h2><p>Provide the source text and tell the model to use only it. Allow “I don’t know”. Ask for reasoning you can check. Verify important facts yourself.</p>
<details><summary>Mini experiment: reveal</summary><p>Ask a chatbot for “three academic papers about [obscure topic] with links”, then try to find them. Check whether each paper really exists.</p></details>`]],
q:[["Roughly how many English words equal 100 tokens?",["About 75","About 300","About 10"],0,"A token is about ¾ of an English word."],["True or false: low temperature makes output more predictable.",["True","False"],0,"Low temperature favors the most likely tokens."],["What mechanism lets a transformer weigh which parts of the text matter?",["Attention","Compression","Caching"],0,"Attention weighs relevance of other tokens."],["Best way to reduce hallucinations?",["Give source text and allow ‘I don’t know’","Use longer greetings","Ask in all capitals"],0,"Grounding in sources and allowing uncertainty helps."]]},
{lv:"Level 1 — Foundations",t:"Your First Prompts",p:[
["What is prompt engineering?",`<p>A <b>prompt</b> is the input you give an AI. <b>Prompt engineering</b> is the practice of designing prompts so the model reliably gives useful output.</p>
<div class="box"><b>Analogy</b><p>Imagine briefing a brilliant new assistant who knows nothing about you. If you say “write something about dogs”, you get a guess. If you say who it is for, what you need and how it should look, you get what you wanted.</p></div>
<p>Prompting is not magic words. It is clear communication: goal, context, constraints and format.</p><div class='box def'><b>📘 Definition</b><p>A <mark class='d'>prompt</mark> is the instruction and information you give an AI. <mark class='d'>Prompt engineering</mark> is designing prompts to get reliable, useful results.</p></div><div class='box fun'><b>😄 Real-life comedy</b><p>Telling a new assistant “do the thing” works about as well with AI as it does with people: you get a confident answer to a question you did not ask.</p></div>`],
["Weak versus strong prompts",`<div class="box weak"><b>Weak prompt</b><pre>Write about exercise.</pre></div>
<div class="box good"><b>Improved prompt</b><pre>You are a friendly fitness coach. Write a 150-word email for office workers aged 25-40 explaining three desk-friendly exercises. Use simple words and end with one motivating sentence.</pre></div>
<h2>Why it works</h2><div class="tw"><table><tr><th>Added element</th><th>Effect</th></tr><tr><td>Role</td><td>Sets voice and expertise</td></tr><tr><td>Audience</td><td>Sets level and examples</td></tr><tr><td>Length and format</td><td>Prevents rambling</td></tr><tr><td>Style rule</td><td>Controls tone</td></tr></table></div>
<p>The weak prompt forces the model to guess the audience, length and purpose. Every guess is a chance to miss.</p><div class='box exp'><b>🧪 Try it: prompt strength checker</b><p>Write any prompt and tap the button. It checks seven key elements (a quick keyword check, not a judge of quality).</p><textarea id='w9' placeholder='Write a prompt…'></textarea><div class='row'><button class='p' onclick='chk(9)'>Check my prompt</button></div><div class='r' id='o9'></div></div><div data-act='0'></div>`],
["Practice",`<h2>Exercise 1: improve it</h2><p>Rewrite this weak prompt: <i>“Help me study.”</i></p><textarea placeholder="Write your improved prompt here…"></textarea>
<details><summary>Reveal sample answer</summary><pre>I am a high-school student preparing for a biology test on photosynthesis next Friday. Create a 5-day study plan with 30 minutes per day. Each day: one short summary and three practice questions. Use simple English.</pre><p>Check yours: did you state the subject, deadline, time available, output format and level?</p></details>
<h2>Exercise 2: spot the missing parts</h2><p>“Write a poem.” Which of these are missing: topic, tone, length, audience?</p>
<details><summary>Reveal answer</summary><p>All four. A better version: “Write a cheerful 8-line rhyming poem about monsoon rain for children.”</p></details>`]],
q:[["Prompt engineering mainly means…",["Designing clear inputs so output is useful","Hacking the model","Memorizing magic phrases"],0,"It is clear, structured communication."],["True or false: ‘Write about exercise.’ is a strong prompt.",["True","False"],1,"It lacks audience, length, format and purpose."],["Which addition most improves ‘Help me study’?",["Subject, deadline, time and format","More exclamation marks","The word ‘please’ only"],0,"Specific context and format guide the answer."]]},
{lv:"Level 2 — Prompt Fundamentals",t:"Anatomy of a Good Prompt",p:[
["The eight building blocks",`<p>Strong prompts are rarely long by accident. They contain a few clear parts. Remember them as <b>R-T-C-R-R-S-O-Q</b>, or just read the table.</p>
<div class="tw"><table><tr><th>Part</th><th>Question it answers</th></tr><tr><td>Role</td><td>Who should the AI act as?</td></tr><tr><td>Task</td><td>What exactly must it do?</td></tr><tr><td>Context</td><td>What background does it need?</td></tr><tr><td>Requirements</td><td>What must the answer include?</td></tr><tr><td>Restrictions</td><td>What must it avoid?</td></tr><tr><td>Style</td><td>What tone and reading level?</td></tr><tr><td>Output</td><td>What format and length?</td></tr><tr><td>Quality check</td><td>How should it verify its work?</td></tr></table></div>
<div class="box"><b>Analogy</b><p>Ordering at a restaurant: dish (task), allergies (restrictions), spice level (style), and portion size (output). The more relevant details you give, the fewer surprises on the plate.</p></div>
<p class="sm">You do not need all eight every time. A simple question needs only a task. Use more parts as the stakes and complexity rise.</p><div class='flow'><span>Role</span><span>Task</span><span>Context</span><span>Requirements</span><span>Restrictions</span><span>Style</span><span>Output</span><span>Quality check</span></div><figure class='dg' data-dg='anat'></figure>`],
["Role, task and context",`<h2>Role</h2><p>A role sets vocabulary, depth and perspective. “Act as a patient maths tutor for a 12-year-old” produces a different answer from “Act as a university lecturer”. A role does not give the model new knowledge; it steers how existing knowledge is expressed.</p>
<h2>Task</h2><p>Use a strong action verb and one clear goal: <i>summarize, compare, rewrite, classify, outline</i>. “Help with my essay” is vague; “Suggest three stronger opening sentences for my essay” is a task.</p>
<h2>Context</h2><p>The model cannot see your life. Tell it the audience, the purpose and the situation.</p>
<div class="box weak"><b>Weak</b><pre>Write a complaint email.</pre></div>
<div class="box good"><b>Improved</b><pre>You are a polite customer-support writer. Write a complaint email to an online shop. Context: my order #4821 arrived 10 days late and the box was damaged. I want a replacement or a refund.</pre></div>
<p><b>Why it works:</b> the model now knows who it is, what to write, and the facts to use, so it does not invent details.</p><div class='box chal'><b>🎯 Practical challenge</b><p>Think of a message you need to write this week. Write a prompt for it with a role, your real context and a word limit. Compare the result with what you get from a one-line prompt.</p></div><div data-act='1'></div>`],
["Requirements, restrictions and style",`<h2>Requirements</h2><p>Things the answer must contain: “include two examples and one common mistake”.</p>
<h2>Restrictions</h2><p>Things to avoid: “do not use jargon”, “do not exceed 120 words”, “use only the text below”. Positive wording usually works better than long lists of “don’t”, so say what you want first, then what to avoid.</p>
<h2>Style</h2><p>Tone (friendly, formal), reading level (simple English), and voice (first person, neutral).</p>
<div class="box good"><b>Example</b><pre>Explain photosynthesis. Include one everyday analogy. Avoid technical terms unless you define them. Tone: warm and clear, for a 14-year-old.</pre></div>
<p><b>Pro tip:</b> constraints are not limits on creativity. They are the edges of the canvas that stop the AI from drifting.</p>`],
["Output, quality check and practice",`<h2>Output</h2><p>Name the format: bullet list, table, JSON, 3 paragraphs, email with subject line. Name the length: “under 100 words”. Models follow a clear format very reliably.</p>
<h2>Quality check</h2><p>Ask the model to review itself: “Before answering, check that every requirement is met. If information is missing, ask me one question.” This does not guarantee correctness, but it catches many slips.</p>
<h2>Exercise: build a full prompt</h2><p>Goal: get a revision plan for an exam. Write a prompt using all eight parts.</p><textarea placeholder="Write your prompt…"></textarea>
<details><summary>Reveal sample answer</summary><pre>Role: You are an experienced chemistry tutor.
Task: Create a 7-day revision plan.
Context: I am a grade-10 student with a chemistry exam in one week; weak topics are moles and acids.
Requirements: 45 minutes per day; each day has a goal and 3 practice questions.
Restrictions: No topics outside acids, bases and moles.
Style: Encouraging, simple English.
Output: A table with columns Day, Topic, Task.
Quality check: Confirm each day fits 45 minutes.</pre></details>`]],
q:[["Which part tells the AI what to avoid?",["Restrictions","Role","Output"],0,"Restrictions set boundaries."],["True or false: every prompt must contain all eight parts.",["True","False"],1,"Use as many parts as the task needs."],["What does a role mainly change?",["How knowledge is expressed","The model’s training data","The context window size"],0,"A role steers voice and depth; it does not add knowledge."],["Which is a clear Output instruction?",["A table with three columns, under 100 words","Make it nice","Be creative"],0,"Format and length are concrete."]]},
{lv:"Level 2 — Prompt Fundamentals",t:"Clarity, Examples and Mistakes",p:[
["Giving clear instructions",`<p>Clear instructions are specific, ordered and testable. Compare:</p>
<div class="box weak"><b>Vague</b><pre>Make this better.</pre></div>
<div class="box good"><b>Clear</b><pre>Rewrite this paragraph to be 30% shorter, keep all dates and names, and use active voice.</pre></div>
<h2>Three habits</h2><p><b>1. One job at a time.</b> Split “research, write and translate” into steps.<br><b>2. Use delimiters.</b> Put pasted text between markers such as triple quotes or &lt;text&gt; tags so instructions and material do not mix.<br><b>3. Make success measurable.</b> “Exactly 5 bullets” beats “a few points”.</p>
<pre>Summarize the text between the triple quotes in 3 bullets.
"""
[your text here]
"""</pre>`],
["Providing examples",`<p>Showing beats telling. An example shows format, tone and level at once. Giving two or three examples is called few-shot prompting (covered fully in Level 3).</p>
<pre>Turn each sentence into a polite request.
Input: Give me the report.
Output: Could you please send me the report?
Input: Move your car.
Output:</pre>
<p>The model continues the pattern. <b>Caution:</b> models copy examples closely, so if all examples are short, answers will tend to be short. Vary them.</p>
<div class="box"><b>Analogy</b><p>Telling a tailor “make it fit well” is weaker than handing over a jacket that fits you.</p></div>`],
["Setting expectations and avoiding vagueness",`<p>Tell the model what a good answer looks like: audience, depth, length, and what to do when unsure (“say ‘not enough information’ instead of guessing”).</p>
<h2>Vague words to replace</h2><div class="tw"><table><tr><th>Vague</th><th>Specific</th></tr><tr><td>Good</td><td>Clear to a beginner, with 2 examples</td></tr><tr><td>Short</td><td>Under 80 words</td></tr><tr><td>Professional</td><td>Formal, no slang, no emojis</td></tr><tr><td>Some ideas</td><td>Exactly 7 ideas, one line each</td></tr></table></div>
<p>Many bad outputs are really unclear requests, so before blaming the model, reread your prompt as a stranger would.</p><div class='box fun'><b>😄 Real-life comedy</b><p>Tell a friend “make me something to eat”. You might get toast, a salad, or silence. An AI is the same, just faster and more eager to please. Be specific.</p></div><div data-act='2'></div>`],
["Common mistakes and practice",`<h2>Eight frequent mistakes</h2><p>1. No context.<br>2. Several tasks in one prompt.<br>3. Vague adjectives.<br>4. No output format.<br>5. Contradictory instructions (“be brief but cover everything in detail”).<br>6. Burying the key instruction in a long paragraph.<br>7. Assuming the AI remembers earlier chats or knows your private documents.<br>8. Accepting the first answer without checking facts.</p>
<h2>Exercise</h2><p>Find the problems in: <i>“Write something good about my business, short but detailed, with everything.”</i></p>
<details><summary>Reveal answer</summary><p>No business details (context), “something good” is vague, “short but detailed” and “everything” contradict each other, and there is no format or audience. Fix: “Write a 60-word Instagram bio for my bakery in Lahore. Mention fresh sourdough and weekend deliveries. Friendly tone.”</p></details>
<h2>Creative challenge</h2><p>Write a prompt asking for a bedtime story. Include character, setting, length, age and tone.</p><textarea placeholder="Write your prompt…"></textarea>`]],
q:[["What are delimiters used for?",["Separating instructions from pasted material","Making the model faster","Lowering temperature"],0,"They keep instructions and text distinct."],["True or false: examples can strongly shape the format of the answer.",["True","False"],0,"Models copy patterns from examples."],["Which prompt contains a contradiction?",["Be brief but cover everything in detail","Use 3 bullets","Write for beginners"],0,"Brief and exhaustive conflict."],["Which is the most measurable?",["Exactly 5 bullets","A few points","Some bullets"],0,"A number can be checked."]]},
{lv:"Level 3 — Intermediate Techniques",t:"Examples and Reasoning",p:[
["Zero-shot, one-shot and few-shot",`<p>The “shot” count is how many worked examples you include.</p>
<div class="tw"><table><tr><th>Type</th><th>Examples</th><th>Best for</th></tr><tr><td>Zero-shot</td><td>0</td><td>Common tasks the model already knows</td></tr><tr><td>One-shot</td><td>1</td><td>Showing a format quickly</td></tr><tr><td>Few-shot</td><td>2–5</td><td>Custom labels, tone or structure</td></tr></table></div>
<h2>Zero-shot</h2><pre>Classify the review as Positive, Negative or Neutral: "The battery died in a day."</pre>
<h2>Few-shot</h2><pre>Review: "Loved it!" -> Positive
Review: "Arrived broken." -> Negative
Review: "It works as described." -> Neutral
Review: "The battery died in a day." ->
</pre>
<p><b>Why it works:</b> the examples define your exact labels and format. Start with zero-shot; add examples only if the result is off. Make examples varied, correct and similar to your real inputs.</p><div class='box chal'><b>🎯 Practical challenge</b><p>Invent your own labels, for example Urgent, Later and Ignore. Write three example messages with labels, then add a new message and see whether the AI follows your pattern.</p></div><div data-act='3'></div>
<div class="box"><b>Analogy</b><p>Training a new colleague: sometimes a sentence is enough, sometimes you say “do it like these three.”</p></div>`],
["Step-by-step prompting",`<p>For multi-part problems, asking the model to work through steps often improves accuracy, because each written step becomes context for the next one. This is the idea behind <b>chain-of-thought</b> prompting.</p>
<div class="box weak"><b>Weak</b><pre>A shop sells 3 pens for 45 rupees. How much do 8 pens cost?</pre></div>
<div class="box good"><b>Improved</b><pre>A shop sells 3 pens for 45 rupees. How much do 8 pens cost? First find the price of one pen, then multiply, then give the final answer on its own line.</pre></div>
<p><b>Good to know:</b> some newer models reason internally before answering, so “think step by step” may matter less for them. Specifying the steps you want (what to compute, in which order) is still useful, because it shapes the structure of the answer.</p>`],
["Reasoning instructions",`<p>Instead of only asking for an answer, tell the model how to approach it:</p>
<p>• “List your assumptions first.”<br>• “Consider two options and compare them before recommending one.”<br>• “Show the calculation, then check it with a different method.”<br>• “If the data is insufficient, say so.”</p>
<pre>I must choose between a laptop (800 USD, 16 GB RAM) and a tablet (500 USD). My use: coding and note-taking. Compare them on those two uses, then recommend one in two sentences.</pre>
<p><b>Caution:</b> written reasoning can look convincing and still be wrong. Treat it as something to check, not proof.</p>
<h2>Mini experiment</h2><p>Ask a multi-step maths question twice: once “answer only”, once with steps. Compare the results.</p>`],
["Practice",`<h2>Exercise 1</h2><p>Write a few-shot prompt that converts casual sentences into formal ones, with two examples.</p><textarea placeholder="Write your prompt…"></textarea>
<details><summary>Reveal sample answer</summary><pre>Rewrite each sentence in formal English.
Casual: Can't make it today, sorry.
Formal: I regret that I will be unable to attend today.
Casual: Send me the file asap.
Formal: Kindly send me the file at your earliest convenience.
Casual: Thanks a ton for helping out!
Formal:</pre></details>
<h2>Exercise 2</h2><p>Which is better for “What is the capital of Japan?”: zero-shot or few-shot? Why?</p>
<details><summary>Reveal answer</summary><p>Zero-shot. It is a simple, well-known fact, so examples add length without value.</p></details>`]],
q:[["How many examples does a one-shot prompt contain?",["One","None","Five"],0,"One-shot means exactly one example."],["True or false: few-shot examples can define custom labels and format.",["True","False"],0,"Examples show the exact pattern wanted."],["Why can step-by-step prompting help?",["Each written step becomes context for the next","It lowers temperature","It enlarges the context window"],0,"Intermediate steps guide later tokens."],["Written reasoning from a model is…",["Something to check, not proof","Always correct","Never useful"],0,"It can look convincing and still be wrong."]]},
{lv:"Level 3 — Intermediate Techniques",t:"Iteration, Context and Evaluation",p:[
["Iterative prompting and refinement",`<p>Professionals rarely get a perfect result from the first prompt. They run a loop: <b>prompt, read, diagnose, adjust</b>.</p>
<div class="tw"><table><tr><th>Problem in output</th><th>Adjustment</th></tr><tr><td>Too long</td><td>Add a word or sentence limit</td></tr><tr><td>Too generic</td><td>Add context and a concrete example</td></tr><tr><td>Wrong tone</td><td>Name the tone and audience</td></tr><tr><td>Messy structure</td><td>Specify the format</td></tr><tr><td>Missed a point</td><td>List it under requirements</td></tr></table></div>
<p>Change one thing at a time so you learn which edit helped. Follow-ups like “Shorten to 80 words, keep the second example” work well.</p>
<div class="box"><b>Analogy</b><p>A sculptor does not expect the statue from the first strike, so refine in passes.</p></div>`],
["Context management",`<p>In a long chat the model reads the whole history each turn, within its context window. Problems appear when the chat grows long, topics mix, or early instructions get diluted.</p>
<h2>Good habits</h2><p>1. One task per conversation.<br>2. Restate key constraints when a chat gets long.<br>3. Paste only the relevant excerpt.<br>4. Ask for a short summary of decisions so far, then start a new chat with that summary.<br>5. Do not assume memory across separate chats unless the tool says it has a memory feature.</p><div class='box tip'><b>✅ Pro tip</b><p>Before ending a long chat, ask for a summary of decisions, rules and open questions. Paste it into your next chat as the first message.</p></div>
<pre>Summarize our decisions so far in 8 bullets: goal, audience, tone, format, and open questions.</pre>`],
["Instruction hierarchy and constraints",`<p>When instructions conflict, which wins? In most AI products, instructions come in layers: the product’s system instructions, then the user’s request, then text inside documents or web pages. Higher layers generally take priority, and text inside pasted material should be treated as data, not commands.</p>
<p>In your own prompts, avoid conflicts and state priority explicitly:</p>
<pre>Priority: accuracy first, brevity second. If they conflict, keep accuracy.</pre>
<h2>Using constraints well</h2><p>Be specific (word counts, formats, banned terms), keep them consistent, and explain why when it helps: “No jargon, because readers are new to the topic.” Too many constraints can crowd out the main task, so keep the ones that matter.</p>`],
["Evaluating AI responses",`<p>Do not ask only “does it sound good?” Use a checklist:</p>
<p>• <b>Accuracy:</b> are the facts right? Verify key claims.<br>• <b>Completeness:</b> were all requirements met?<br>• <b>Relevance:</b> does it answer what you asked?<br>• <b>Format:</b> is it the right structure and length?<br>• <b>Tone:</b> right for the audience?<br>• <b>Risk:</b> would a mistake here cause harm?</p>
<p>Check specific names, numbers, dates and citations yourself, and raise your scrutiny for medical, legal or financial topics, where errors matter most.</p>
<h2>Exercise</h2><p>An AI gives a 400-word answer when you needed 100, in a stiff tone. Write the follow-up prompt.</p><textarea placeholder="Write your follow-up…"></textarea>
<details><summary>Reveal sample answer</summary><pre>Rewrite your answer in under 100 words. Keep the two main points, drop the examples, and use a friendly, conversational tone.</pre></details><div data-act='4'></div>`]],
q:[["Best way to refine a weak prompt?",["Change one thing at a time","Rewrite everything randomly","Add more capital letters"],0,"Single changes show what helped."],["True or false: text pasted inside a document should be treated as data, not commands.",["True","False"],0,"Higher-level instructions normally take priority."],["What helps when a chat becomes very long?",["Summarize decisions and start a new chat","Keep adding topics","Remove all instructions"],0,"A fresh start avoids diluted context."],["Which should you verify yourself?",["Names, numbers, dates and citations","Nothing","Only formatting"],0,"Specific facts are common hallucination spots."]]},
{lv:"Level 4 — Advanced Techniques",t:"Workflows and Structure",p:[
["Prompt chaining and multi-step workflows",`<p><b>Prompt chaining</b> means splitting a big job into several prompts, where each output feeds the next. Instead of one giant request, you build an assembly line.</p>
<div class="tw"><table><tr><th>Step</th><th>Prompt</th><th>Output</th></tr><tr><td>1</td><td>Extract the key facts from this article</td><td>Bullet list</td></tr><tr><td>2</td><td>Turn the facts into a 5-slide outline</td><td>Outline</td></tr><tr><td>3</td><td>Write speaker notes for each slide</td><td>Notes</td></tr><tr><td>4</td><td>Check the notes against the facts</td><td>Corrections</td></tr></table></div>
<p><b>Why it works:</b> each step is simple and checkable, and you can fix problems before they spread. The cost is more prompts to manage.</p><div class='flow'><span>Extract facts</span><em>→</em><span>Outline</span><em>→</em><span>Draft</span><em>→</em><span>Check</span></div><figure class='dg' data-dg='chain'></figure>
<div class="box"><b>Analogy</b><p>A restaurant kitchen: prep, cook, plate, inspect. One person doing everything at once makes more mistakes.</p></div>`],
["Complex task decomposition",`<p>Decomposition is the skill of breaking a goal into smaller tasks. Ask: what is the end result, what pieces make it up, and in what order?</p>
<div class="box weak"><b>Weak</b><pre>Create a business plan for my cafe.</pre></div>
<div class="box good"><b>Improved</b><pre>I want to open a small cafe. Do not write the full plan yet. First list the 8 sections a cafe business plan needs, with one sentence each on what to include. Then wait for me to choose which section to start with.</pre></div><div data-act='5'></div>
<p>You can even let the model help decompose: “Break this goal into steps and tell me what information you need from me for each.”</p>`],
["Structured prompting",`<p>Structure makes prompts easier for both you and the model to follow. Use labelled sections, delimiters and clear output formats.</p>
<pre>&lt;role&gt;Data cleaner&lt;/role&gt;
&lt;task&gt;Extract name and email from the text.&lt;/task&gt;
&lt;text&gt;Contact Sara Khan at sara@example.com&lt;/text&gt;
&lt;output&gt;JSON with keys name and email&lt;/output&gt;</pre>
<p>Requesting <b>JSON</b> output helps when a program will read the result. Tell the model the exact keys and to return only the JSON. Always validate it in code, since models can occasionally produce invalid or incomplete output.</p>`],
["System instructions and practice",`<p><b>System instructions</b> (a system prompt) are standing rules set before the conversation: the assistant’s role, tone, boundaries and format. Many chat tools and all major APIs offer them in some form.</p>
<pre>You are a study buddy for high-school students. Explain in simple English. Give one example per answer. If asked for unrelated topics, politely steer back to studying. Never give exam answers to copy.</pre>
<p>Keep them clear, consistent and testable, and never put secrets in them, since users may be able to coax them out.</p>
<h2>Exercise</h2><p>Decompose this goal into a 4-step prompt chain: “Write a blog post about healthy sleep.”</p><textarea placeholder="Your chain…"></textarea>
<details><summary>Reveal sample answer</summary><p>1) Brainstorm 10 angles and pick the best 3. 2) Outline the chosen angle. 3) Draft each section from the outline. 4) Edit for tone, length and accuracy.</p></details>`]],
q:[["In prompt chaining, each step…",["Feeds its output into the next","Runs without any input","Replaces the system prompt"],0,"Outputs become inputs."],["True or false: JSON output from a model should be validated in code.",["True","False"],0,"Models can occasionally return invalid output."],["What are system instructions?",["Standing rules set before the chat","A type of tokenizer","A temperature value"],0,"They define role, tone and boundaries."],["Main benefit of decomposition?",["Simpler steps that are easier to check","Fewer tokens always","No need for review"],0,"Small tasks are easier to verify."]]},
{lv:"Level 4 — Advanced Techniques",t:"Specialized Prompting",p:[
["Hallucinations and long documents",`<p>You met hallucinations in Chapter 2. Here is the working toolkit.</p>
<p><b>1. Ground it.</b> Paste the source and say “use only this text”.<br><b>2. Allow uncertainty.</b> “If the answer is not in the text, say so.”<br><b>3. Ask for evidence.</b> “Quote the sentence that supports each claim.”<br><b>4. Verify.</b> Check key facts and any citations yourself.</p>
<h2>Long documents</h2><p>Very long inputs can exceed the context window, and details in the middle can be overlooked. Try: split the document into sections, summarize each, then combine the summaries. Put your question and instructions clearly, and ask for locations (“section 3”) so you can check.</p>
<pre>Using only the report below, list the 5 main risks. For each, quote the supporting sentence. If a risk is not stated, write "not stated".</pre><div data-act='6'></div>`],
["Multimodal, image and video prompting",`<p><b>Multimodal</b> models handle more than text, such as images, audio or documents. Capabilities vary by model, so check what yours supports.</p>
<h2>Understanding images</h2><pre>Look at this chart. Describe the trend in two sentences, then list any values you cannot read clearly.</pre>
<h2>Generating images or video</h2><p>Describe: <b>subject, setting, style, lighting, camera angle, mood</b>. For video add motion and duration.</p>
<div class="box weak"><b>Weak</b><pre>A cat in a garden.</pre></div>
<div class="box good"><b>Improved</b><pre>A ginger cat sleeping on a stone path in a sunny cottage garden, soft morning light, watercolor style, wide shot, calm mood.</pre></div>
<p>Image and video tools differ in how they read prompts, so experiment and iterate.</p><div class='box chal'><b>🎯 Practical challenge</b><p>Describe the same scene three ways: once with only a subject, once with style and lighting, and once with camera angle and mood. Compare how much control each version gives you.</p></div>`],
["Coding and data analysis prompts",`<p>For code, state the language, the goal, inputs and outputs, and constraints.</p>
<pre>Write a Python function is_palindrome(text) that ignores spaces and case. Include 3 test examples and explain the logic in two sentences.</pre>
<p>Useful requests: explain this error, add comments, find the bug, suggest tests. <b>Always run and review generated code.</b> It can look right and still fail.</p>
<h2>Data analysis</h2><p>Describe your columns and your question. Ask for the method as well as the answer, so you can check it.</p>
<pre>Columns: date, product, units, price. Which product had the highest total revenue? Show the formula you used and a small table of the top 3.</pre>
<p>Never paste private or sensitive data into tools you do not trust with it.</p>`],
["Research prompts and practice",`<p>AI can speed up research as a thinking partner, not as a final authority.</p>
<pre>I am studying renewable energy. Give me 5 subtopics, one sentence each, and 3 questions I should investigate for each. Then suggest what kinds of sources (reports, journals, official statistics) to check.</pre>
<p>Rules: verify claims with original sources, confirm any cited paper exists, and note that models without search access may not know recent events.</p>
<h2>Exercise</h2><p>Write a prompt that summarizes a pasted article safely, avoiding invented facts.</p><textarea placeholder="Your prompt…"></textarea>
<details><summary>Reveal sample answer</summary><pre>Summarize the article between the triple quotes in 5 bullets. Use only information in the article. If a detail is unclear, write "unclear". Add one quote supporting each bullet.
"""
[article]
"""</pre></details>`]],
q:[["Best defence against hallucination?",["Grounding in source text and allowing ‘not stated’","Asking louder","Using longer prompts only"],0,"Grounding and permission to say unknown help."],["True or false: generated code should always be tested.",["True","False"],0,"Code can look right and still fail."],["A good image prompt includes…",["Subject, setting, style, lighting","Only one word","Only a file name"],0,"Details guide generation."],["For long documents, a useful method is…",["Summarize sections, then combine","Paste everything and hope","Delete the question"],0,"Chunking avoids overload."]]},
{lv:"Level 5 — Professional Mastery",t:"Professional Prompt Engineering",p:[
["Prompt architecture",`<p>A professional prompt is designed like a small product. A common architecture has layers:</p>
<div class="tw"><table><tr><th>Layer</th><th>Contains</th><th>Changes how often?</th></tr><tr><td>System</td><td>Role, rules, tone, safety boundaries</td><td>Rarely</td></tr><tr><td>Task template</td><td>Instructions with fill-in slots</td><td>Sometimes</td></tr><tr><td>Examples</td><td>Few-shot samples</td><td>Sometimes</td></tr><tr><td>Input data</td><td>The user’s text or document</td><td>Every time</td></tr><tr><td>Output spec</td><td>Format, schema, length</td><td>Rarely</td></tr></table></div>
<p>Separating stable parts from variable parts makes prompts easier to test, reuse and fix. Plan for edge cases too: empty input, wrong language, or off-topic requests.</p>`],
["Testing and evaluating prompts",`<p>One good result proves little, because models can vary between runs. Test a prompt like a recipe: try it on many cases.</p>
<p><b>1. Build a test set</b> of 10–30 realistic inputs, including easy, hard and tricky ones.<br><b>2. Define what “good” means</b> before testing.<br><b>3. Run, score and record.</b><br><b>4. Change one thing, then rerun the same set.</b></p>
<p>Include failure cases you have seen before, so old bugs do not return when you edit the prompt.</p>
<div class="box"><b>Analogy</b><p>A teacher judges a student on a whole exam, not one lucky answer.</p></div><div class='box chal'><b>🎯 Practical challenge</b><p>Pick one prompt you use often. Write ten realistic test inputs for it, including two tricky ones. Run them all and score each result from 1 to 5.</p></div>`],
["Optimization and measuring quality",`<p>Use a <b>rubric</b>: a short scoring guide. Example, scoring each 1–5:</p>
<div class="tw"><table><tr><th>Criterion</th><th>What a 5 looks like</th></tr><tr><td>Accuracy</td><td>All facts supported by the source</td></tr><tr><td>Completeness</td><td>Every requirement covered</td></tr><tr><td>Format</td><td>Exactly as specified</td></tr><tr><td>Tone</td><td>Fits the audience</td></tr></table></div>
<p>Some checks can be automated: valid JSON, word count, required keywords. For judgments of quality, human review is the safest standard. Using one AI to grade another can help at scale, but it has biases, so spot-check with people.</p>
<p><b>Optimization tips:</b> shorten wordy instructions, clarify ambiguous ones, add one good example, and keep a record of what each change did. More cost or length is not always better.</p>`],
["Prompt libraries and practice",`<p>A <b>prompt library</b> is your collection of tested, reusable prompts. For each, store: name, purpose, template with [slots], an example input and output, the model used, version, and known limits.</p>
<pre>Name: Email polisher v2
Purpose: Improve clarity and tone
Template: Rewrite the email below in a [tone] tone, under [N] words. Keep all facts.
"""[email]"""
Notes: Fails on very long threads.</pre>
<p>Version your prompts so you can go back when an edit makes things worse. Share libraries with teammates for consistency.</p>
<h2>Exercise</h2><p>Design a 4-criterion rubric to score AI-written product descriptions.</p><textarea placeholder="Your rubric…"></textarea>
<details><summary>Reveal sample answer</summary><p>Accuracy (matches product facts), Clarity (easy to read), Persuasiveness (highlights benefits), Compliance (length and banned claims respected). Score each 1–5 on a test set of 15 products.</p></details>`]],
q:[["Why test a prompt on many inputs?",["One good output can be luck","It speeds up the model","It enlarges the context"],0,"Models vary, so broad testing shows reliability."],["True or false: a rubric defines what good output looks like.",["True","False"],0,"It gives clear scoring criteria."],["What should a prompt library entry include?",["Template, example, version and limits","Only the title","Only the answer"],0,"Documentation makes prompts reusable."],["When editing a prompt for testing, you should…",["Change one thing and rerun the same set","Change everything at once","Skip testing"],0,"This isolates what helped."]]},
{lv:"Level 5 — Professional Mastery",t:"Agents, APIs and Complete Systems",p:[
["AI agents",`<p>A chatbot answers. An <b>AI agent</b> pursues a goal: it plans, uses tools (such as search, a calculator or a calendar), checks results and continues until done or stuck.</p>
<p>A basic loop: <b>goal, plan, act with a tool, observe the result, decide the next step</b>.</p><div class='flow'><span>Goal</span><em>→</em><span>Plan</span><em>→</em><span>Use a tool</span><em>→</em><span>Observe</span><em>↻</em><span>Next step</span></div><figure class='dg' data-dg='agent'></figure>
<h2>Prompting agents well</h2><p>State the goal and success criteria, list the tools and when to use them, set limits (which actions are not allowed), and require confirmation before risky actions such as sending emails or spending money.</p>
<p>Agents can make mistakes that compound across steps, so start with low-risk tasks and keep a human in the loop.</p>`],
["AI APIs",`<p>An <b>API</b> lets your own program send a prompt to a model and receive the reply, so you can build apps without a chat window. Details differ by provider, so read the official documentation, but the concepts are shared.</p>
<div class="tw"><table><tr><th>Concept</th><th>Meaning</th></tr><tr><td>Model</td><td>Which model to call</td></tr><tr><td>System / user messages</td><td>Standing rules and the current request</td></tr><tr><td>Temperature</td><td>Randomness (Chapter 2)</td></tr><tr><td>Max tokens</td><td>Upper limit on reply length</td></tr><tr><td>Usage cost</td><td>Typically billed by tokens</td></tr></table></div>
<p>Practical rules: keep keys secret and out of public code, handle errors and timeouts, validate outputs, and never trust model output blindly in a program.</p>`],
["Automated workflows and real-world systems",`<p>Combine chaining, structured output and code to automate tasks:</p>
<p>• <b>Support triage:</b> classify an email, draft a reply, route to a human.<br>• <b>Document pipeline:</b> extract fields, validate, store in a spreadsheet.<br>• <b>Content pipeline:</b> brief, outline, draft, edit, publish checklist.<br>• <b>Study assistant:</b> notes, quiz, feedback, revision plan.</p>
<h2>Design checklist</h2><p>Define the goal. Break it into steps. Write and test each prompt. Add validation between steps. Decide where a human reviews. Log failures. Protect private data. Plan for model changes, since behavior can shift between versions.</p><div data-act='7'></div>`],
["Capstone project",`<h2>Build a complete AI-powered study assistant (design)</h2><p>Use everything you learned. Produce:</p>
<p>1. A system prompt (role, tone, boundaries).<br>2. A task template for explaining a topic with one analogy and one example.<br>3. A quiz-generation prompt that returns JSON.<br>4. A 10-input test set and a 4-criterion rubric.<br>5. A short note on risks: hallucinations, privacy and when a human should check.</p><textarea placeholder="Draft your system prompt…"></textarea>
<details><summary>Reveal a sample system prompt</summary><pre>You are a patient study assistant for students aged 13-18. Explain topics in simple English with one everyday analogy and one worked example. If you are unsure, say so and suggest how to verify. Do not complete graded assignments; guide the student instead. Keep answers under 200 words unless asked for more.</pre></details>
<p><b>Congratulations.</b> You now know how AI generates text, how to write, test and improve prompts, and how to design workflows. Keep practising with real tasks. That is how skill grows.</p>`]],
q:[["What most distinguishes an AI agent from a basic chatbot?",["It plans and uses tools toward a goal","It is always more accurate","It has no prompts"],0,"Agents act in loops with tools."],["True or false: API keys should be kept secret.",["True","False"],0,"Exposed keys can be misused and cost money."],["Good practice for risky agent actions?",["Require human confirmation","Let it act freely","Hide the actions"],0,"Human oversight limits compounding errors."],["In an automated workflow, validation between steps…",["Catches errors before they spread","Is unnecessary","Slows nothing"],0,"Checks stop bad outputs from propagating."]]}
